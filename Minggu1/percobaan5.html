<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Percobaan 5 - List</title>
</head>
<body>
    <p>Unordered List (Lingkaran)</p>
    <ul type="circle">
        <li>Sunday</li>
        <li>Monday</li>
        <li>Tuesday</li>
    </ul>
    <p>Unordered List (Kotak)</p>
    <ul type="square">
        <li>Sunday</li>
        <li>Monday</li>
        <li>Tuesday</li>
    </ul>
    <p>Ordered List (angka)</p>
    <ol type="1">
        <li>Sunday</li>
        <li>Monday</li>
        <li>Tuesday</li>
    </ol>
    <p>Ordered List (huruf)</p>
    <ol type="a">
        <li>Sunday</li>
        <li>Monday</li>
        <li>Tuesday</li>
    </ol>
</body>
</html>
