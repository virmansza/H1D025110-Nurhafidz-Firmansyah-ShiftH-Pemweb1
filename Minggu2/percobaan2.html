<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Percobaan 2</title>
</head>
<body>
    <form name="form" method="post" action="">
        <label for="name">Name:</label><br>
        <input type="text" name="name" id="name"><br>
        <label for="number">Number:</label><br>
        <input type="number" name="number" id="number"><br>
        <label for="tel">Tel:</label><br>
        <input type="tel" name="tel" id="tel"><br>
        <label for="email">Email:</label><br>
        <input type="email" name="email" id="email"><br>
        <label for="password">Password:</label><br>
        <input type="password" name="password" id="password"><br>
        <label for="birthday">Birthday:</label><br>
        <input type="date" name="birthday" id="birthday"><br>
        <input type="radio" id="html" name="fav_language" value="HTML">
        <label for="html">HTML</label><br>
        <input type="radio" id="css" name="fav_language" value="CSS">
        <label for="css">CSS</label><br>
        <input type="radio" id="javascript" name="fav_language" value="JavaScript">
        <label for="javascript">JavaScript</label><br>

        <input type="checkbox" name="vehicle1" id="vehicle1" value="Bike">
        <label for="vehicle1">I have a bike</label><br>
        <input type="checkbox" name="vehicle2" id="vehicle2" value="Car">
        <label for="vehicle2">I have a car</label><br>
        <input type="checkbox" name="vehicle3" id="vehicle3" value="Boat">
        <label for="vehicle3">I have a plane</label><br>
        <label for="favcolor">Select your favorite color:</label>
        <input type="color" id="favcolor" name="favcolor"><br>
        <textarea name="textarea" rows="10" cols="30"></textarea><br>
        <input type="button" name="button" value="button"><br>
        <input type="submit" id="submit name="submit" value="submit"><br>
        <input type="reset" id="reset name="reset" value="reset"><br>
    </form>
</body>
</html>
