<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas</title>
</head>
<body>
    <table>
        <tr>
            <td>Input 1</td>
            <td><input type="text" name="input1" value="Cuma bisa dibaca kok." readonly></td>
        </tr>
        <tr>
            <td>Input 2</td>
            <td><input type="text" name="input2" id="" maxlength="5" placeholder="maksimal 5 karakter.."></td>
        </tr>
        <tr>
            <td>Input 3</td>
            <td><input type="text" name="input3" id="" placeholder="tidak bisa diisi" disabled></td>
        </tr>
        <tr>
            <td>Input 4</td>
            <td><input type="text" name="input4" id="" placeholder="Wajib diisi" required></td>
        </tr>
        <tr>
            <td>Input 5</td>
            <td><input type="text" name="input5" id="" pattern="[a-z0-9]{9}" placeholder="isi nim, misal h1d025110" maxlength="9"></td>
        </tr>
        <tr>
            <td><input type="submit" value="Submit"></td>
        </tr>
    </table>
</body>
</html>
